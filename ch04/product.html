<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>商品資訊表格</title>
  
</head>
<body>
  <table frame="border" rules="all">
    <caption>這邊是商品資訊表喔</caption>

    <thead>
      <tr>
        <th>名稱</th>
        <th>價格</th>
        <th>熱量</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>fuze tea 飛想茶-檸檬紅茶</td>
        <td>$25</td>
        <td>102大卡</td>
      </tr>
      <tr>
        <td>百事可樂</td>
        <td>$35</td>
        <td>152大卡</td>
      </tr>
      <tr>
        <td>古道梅子綠茶</td>
        <td>$35</td>
        <td>217.8大卡</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="3">持續上新中</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
