<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>憨吉小宇宙</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#home">憨吉小宇宙</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="切換導覽">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#home">關於憨吉</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#section1">生活習性</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#section2">照片展示</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#section3">照顧方式與注意事項</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#footer">頁尾</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main id="top">

  <section id="home" class="py-5">
    <div class="container">
      <div class="row align-items-center g-4">
        <div class="col-md-6">
          <div class="border rounded overflow-hidden rect-img-box">
            <img src="img/135.jpg" class="rect-img" alt="憨吉">
          </div>                                   
        </div>
        <div class="col-md-6">
          <h2 class="fw-bold">關於憨吉</h2>
          <p class="text-muted">
            這裡放首頁的介紹文字，左側圖片呈現。
          </p>
        </div>
      </div>
    </div>
  </section>

  <section id="section1" class="py-5 bg-light">
    <div class="container">
      <div class="row align-items-center g-4 flex-md-row-reverse">
        <div class="col-md-6">
          <div class="border rounded overflow-hidden rect-img-box">
            <img src="img/section1.jpg" class="rect-img" alt="生活習性">
          </div>         
          生活習性
          </div>
        </div>
        <div class="col-md-6">
          <h2 class="fw-bold">生活習性</h2>
          <p class="text-muted">
            右側圖片、左側文字。放第一段內容。
          </p>
        </div>
      </div>
    </div>
  </section>

  <section id="section2" class="py-5">
    <div class="container">
      <div class="row align-items-center g-4">
  
        <!-- 左側：照片展示 -->
        <div class="col-md-6">
          <div class="row g-3">
            <div class="col-6">
              <img src="img/photo1.jpg" class="img-fluid rounded" alt="照片1">
            </div>
            <div class="col-6">
              <img src="img/photo2.jpg" class="img-fluid rounded" alt="照片2">
            </div>
            <div class="col-6">
              <img src="img/photo3.jpg" class="img-fluid rounded" alt="照片3">
            </div>
            <div class="col-6">
              <img src="img/photo4.jpg" class="img-fluid rounded" alt="照片4">
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <h2 class="fw-bold">照片展示</h2>
          <p class="text-muted">
            左側圖片、右側文字。這裡可以放照片介紹或說明內容。
          </p>
        </div>
  
      </div>
    </div>
  </section>
  

  <section id="section3" class="py-5 bg-light">
    <div class="container">
      <div class="row align-items-center g-4 flex-md-row-reverse">
        <div class="col-md-6">
          <div class="border rounded overflow-hidden rect-img-box">
            <img src="img/section1.jpg" class="rect-img" alt="照顧方式與注意事項">
          </div>          
          照顧方式與注意事項
          </div>
        </div>
        <div class="col-md-6">
          <h2 class="fw-bold">照顧方式與注意事項</h2>
          <p class="text-muted">
            右側圖片、左側文字。放第三段內容。
          </p>
        </div>
      </div>
    </div>
  </section>
 
</main>

<footer id="footer" class="bg-dark text-white py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 text-center">
        <h2 class="fw-bold">頁尾</h2>
        <p class="text-muted">
          放版權或聯絡資訊。
        </p>
      </div>
    </div>
  </div>
</footer>


<script src="../js/bootstrap.bundle.min.js"></script>
</body>
</html>
